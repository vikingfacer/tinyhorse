header:
  version: 14

machine: qemux86-64
distro: tiny-horse
target: tiny-horse-image

repos:
  poky:
    url: https://git.yoctoproject.org/poky
    branch: scarthgap
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-tiny-horse:
    path: meta-tiny-horse

local_conf_header:
  tiny-horse: |
    # Keep the rootfs small; drop the default extra image types.
    IMAGE_FSTYPES = "ext4"
