BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "tiny-horse"
BBFILE_PATTERN_tiny-horse = "^${LAYERDIR}/"
BBFILE_PRIORITY_tiny-horse = "6"

LAYERDEPENDS_tiny-horse = "core"
LAYERSERIES_COMPAT_tiny-horse = "scarthgap"
